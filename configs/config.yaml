# Single source of truth for modeling decisions. Change here, not in code.
project:
  name: player-value-forecaster
  seed: 42

panel:
  anchor_month_day: "07-01"        # settled, decision #1
  min_anchor_season: 2013          # appearances starts 2012-07-03, so 2012 has no prior season
  max_value_staleness_days: 365    # drop anchors whose latest value is older than this
  # Settled, decisions #3 and #4. Poland (PL1) is out: games only covers it from 2024.
  leagues: ["GB1", "IT1", "ES1", "L1", "FR1", "PO1", "BE1", "NL1", "TR1"]

target:
  horizons: [1, 2, 3]              # seasons ahead
  transform: log_ratio             # log(value_{t+h} / value_t)

model:
  quantiles: [0.1, 0.5, 0.9]
  families:
    trained_from_scratch: lightgbm
    off_the_shelf: chronos         # OPEN DECISION: second rubric model type

split:
  # Seasons are anchor years. Test anchors must leave room for the horizon.
  train_last_season: 2020
  val_season: 2021
  test_seasons: [2022, 2023, 2024, 2025]
  values_available_until: "2026-06-12"

paths:
  raw_player_scores: data/raw/player-scores
  raw_football_datasets: data/raw/football-datasets
  manual: data/manual
  synthetic: data/synthetic
  processed: data/processed
  bundle: app/predictions
