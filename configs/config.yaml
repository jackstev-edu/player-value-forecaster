# Single source of truth for modeling decisions. Change here, not in code.
# Scope since 2026-09-27: the 500 hand-collected contracts, augmented to 1000 (docs/scope_change.md).
project:
  name: player-value-forecaster
  seed: 42

samples:
  anchor_month_day: "07-01"        # settled, decision #1; a later-summer signing moves the anchor to the signing date
  max_value_staleness_days: 365    # no sample value if the latest valuation is older than this
  # Kaggle is now used only for these two tables: values give the target, players give age and position
  kaggle_tables: ["player_valuations", "players"]

target:
  horizons: [1]                    # one season ahead; 2023/24 rows have no 2- or 3-season target
  transform: log_ratio             # log(value_{t+h} / value_t)

augment:
  method: contract_span            # extra 1 July anchors inside each collected contract
  target_total: 1000               # manual rows plus augmented rows; null keeps every augmented row

model:
  quantiles: [0.1, 0.5, 0.9]
  families:
    trained_from_scratch: lightgbm
    off_the_shelf: chronos         # OPEN DECISION: second rubric model type

split:
  method: player_group_kfold       # every player on one side of each fold; only manual rows scored
  n_splits: 5
  values_available_until: "2026-06-12"

paths:
  raw_player_scores: data/raw/player-scores
  manual: data/manual
  synthetic: data/synthetic
  processed: data/processed
  bundle: app/predictions
